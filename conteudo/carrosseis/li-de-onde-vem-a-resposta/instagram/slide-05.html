<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../_modelo/style.css">
<style>
  .stat { display:grid; grid-template-columns: minmax(260px, auto) 1fr; align-items:center; gap:36px; padding:40px 0; border-top:2px solid var(--linha-clara); }
  .azul .stat { border-top-color: var(--linha-escura); }
  .stat:last-of-type { border-bottom:2px solid var(--linha-clara); }
  .azul .stat:last-of-type { border-bottom-color: var(--linha-escura); }
  .stat .n { white-space:nowrap; font-family:'Archivo'; font-stretch:62%; font-weight:900; font-size:200px; line-height:.85; letter-spacing:-0.03em; }
  .branco .stat .n { color:var(--azul); } .azul .stat .n { color:#fff; }
  .stat .n::after { content:""; display:block; width:120px; height:12px; background:var(--laranja); margin-top:14px; }
  .fonte { font-family:'JetBrains Mono'; font-size:22px; line-height:1.4; opacity:.75; }</style></head>
<body>
<div class="slide branco">
  <div class="topo"><span>IBA Estúdios</span><span>@ibaestudios</span><span class="num">05/10</span></div>

  <h2 class="h">A conta da base <em>incompleta</em>.</h2>
  <div class="spacer"></div>
  <div class="stat"><div class="n" style="font-size:240px">3</div><p class="p">fontes sustentam cada resposta: contexto, regra e histórico.</p></div><div class="stat"><div class="n" style="font-size:240px">1</div><p class="p">arquivo de regras basta para começar, escrito na linguagem da empresa.</p></div>
  <div class="spacer"></div>
  <p class="fonte">Medição interna da operação da IBA Estudio, outubro de 2026.</p>
</div>
</body></html>
