<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .capa { padding: 0; background: #0B1220; color: #fff; }
  .capa .bg { position: absolute; width: 1200px; height: 1800px; left: -60px; top: -500px; filter: brightness(1.35) contrast(1.05); }
  .capa .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,14,28,0.6) 0%, rgba(8,14,28,0) 14%, rgba(8,14,28,0) 46%, rgba(8,14,28,0.85) 64%, rgba(8,14,28,0.98) 100%); }
  .capa .conteudo { position: absolute; left: 72px; right: 72px; bottom: 96px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .capa .marca { margin-bottom: 30px; }
  .capa h1 { font-family: 'Archivo', sans-serif; font-stretch: 62%; font-weight: 900; text-transform: uppercase; font-size: 124px; line-height: 0.9; letter-spacing: -0.01em; }
  .capa h1 span { color: var(--laranja); }
  .capa .chamada { margin-top: 38px; font-family: 'Archivo'; font-stretch: 75%; font-weight: 800; text-transform: uppercase; font-size: 40px; line-height: 1.15; letter-spacing: 0; }
  .capa .chamada b { color: var(--laranja); }
</style></head>
<body>
<div class="slide capa">
  <img class="bg" src="imagens/capa.jpg" alt="">
  <div class="shade"></div>
  <div class="topo"><span>IBA Estúdios</span><span>@ibaestudio</span><span class="num">01/10</span></div>
  <div class="conteudo">
    <div class="marca"><span class="logo">IBA</span>@ibaestudio</div>
    <h1>O cliente que você <span>perdeu enquanto dormia</span></h1>
    <p class="chamada"><b>→</b> Por que responder em 1 hora vale 7 vezes mais</p>
  </div>
</div>
</body></html>
