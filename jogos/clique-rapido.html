        <h1>Clique Rápido 10s</h1>
        <p>Toque ou clique no botão o máximo de vezes antes que os 10 segundos acabem.</p>
      </section>

      <section class="section">
        <article class="card game-card">
          <p id="click-status" class="result" aria-live="polite" role="status">Tempo: 10s · CPS: 0.0 · Melhor: 0</p>
          <div class="game-progress-wrap"><div id="click-progress" class="game-progress-bar" style="width:100%"></div></div>
          <div id="click-count" class="click-count-display" aria-live="polite">0</div>
          <button id="click-target" class="click-target-area idle" type="button">Toque para iniciar</button>
          <div class="field-row">
            <button id="click-reset" class="btn btn-primary">Jogar novamente</button>
            <button id="click-share" class="btn btn-secondary">Compartilhar resultado</button>
          </div>
