  <body>
    <a class="skip-link" href="#conteudo-principal">Pular para conteúdo</a>
    <header class="header">
      <div class="container nav">
        <a class="brand" href="../">Jogos IBA</a>
        <button class="menu-toggle" type="button" aria-label="Abrir menu de navegação" aria-expanded="false">
          <span class="menu-toggle-bar"></span>
          <span class="menu-toggle-bar"></span>
          <span class="menu-toggle-bar"></span>
        </button>
        <nav>
          <a href="../">Home</a>
          <a href="../jogos.html">Jogos</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar tema claro e escuro">Modo escuro</button>
      </div>
    </header>

    <main id="conteudo-principal" class="container page-main">
      <section class="section-intro">
        <h1>Teste de Reação</h1>
        <p>Quando o bloco ficar verde, clique o mais rápido possível.</p>
      </section>

      <section class="section">
        <article class="card game-card">
          <div class="field-row">
            <button id="reaction-start" class="btn btn-accent" type="button">Iniciar rodada</button>
            <button id="reaction-share" class="btn btn-secondary" type="button">Compartilhar</button>
          </div>
          <button id="reaction-box" class="reaction-box" type="button">Clique em "Iniciar rodada"</button>
          <p id="reaction-result" class="result">Seu resultado aparecerá aqui.</p>
          <div class="game-score-row">
            <span id="reaction-best" class="game-score-pill"><span class="pill-icon" aria-hidden="true"><svg viewBox="0 0 20 20" focusable="false"><path d="M6 2h8v3h2.5v1.5A3.5 3.5 0 0 1 13 10h-.4A4 4 0 0 1 11 12.6V15h2.5v3h-7v-3H9v-2.4A4 4 0 0 1 7.4 10H7a3.5 3.5 0 0 1-3.5-3.5V5H6V2Zm-1 4.5V5H4v1.5A2 2 0 0 0 5.5 8.4 5 5 0 0 1 5 6.5Zm10 0a5 5 0 0 1-.5 1.9A2 2 0 0 0 16 6.5V5h-1v1.5Z" fill="currentColor"/></svg></span> Recorde: --</span>
            <span id="reaction-avg" class="game-score-pill"><span class="pill-icon" aria-hidden="true"><svg viewBox="0 0 20 20" focusable="false"><path d="M3 16V9h3v7H3Zm5.5 0V4h3v12h-3ZM14 16v-5h3v5h-3Z" fill="currentColor"/></svg></span> Média: --</span>
          </div>
          <p id="reaction-history" style="font-size:0.85rem;color:var(--muted);margin-top:4px"></p>

          <p class="context-links">
            Veja também: <a href="../jogos.html">Catálogo de Jogos</a> ·
            <a href="./clique-rapido.html">Clique Rápido 10s</a>
          </p>
        </article>
      </section>
    </main>

    <footer class="footer">

        <p>
          Explore: <a href="../">Home</a> · <a href="../jogos.html">Jogos</a>

        <div class="footer-brand">
          <span class="footer-mascot-chip">
            <img class="footer-mascot" src="../assets/img/mascote-no.png" alt="" width="22" height="22" />
          </span>
          <img class="footer-logo" src="../assets/img/logo-iba-horizontal.png" alt="IBA Estúdio" height="18" />
          <img class="footer-logo footer-logo-invert" src="../assets/img/logo-iba-horizontal-branco.png" alt="" height="18" />
        </div>
