    <main id="conteudo-principal" class="container page-main">
      <section class="section-intro">
        <h1>Pedra-Papel-Tesoura</h1>
        <p>Dispute contra o computador e acompanhe seu placar e sequência máxima de vitórias.</p>
      </section>

      <section class="section">
        <article class="card game-card">
          <p id="ppt-status" class="result" aria-live="polite" role="status">Placar: Você 0 × 0 CPU · Empates: 0 · Sequência: 0 · Recorde: 0</p>
          <div id="ppt-arena" class="ppt-arena" aria-live="polite"></div>
          <p>Escolha sua jogada:</p>
          <div class="ppt-choices">
            <button class="btn btn-primary" data-ppt="pedra" aria-label="Pedra">✊</button>
            <button class="btn btn-primary" data-ppt="papel" aria-label="Papel">✋</button>
            <button class="btn btn-primary" data-ppt="tesoura" aria-label="Tesoura">✌️</button>
          </div>
          <p id="ppt-result" class="result" aria-live="polite" role="status">Escolha sua jogada!</p>
          <div class="field-row">
            <button id="ppt-reset" class="btn btn-secondary">Jogar novamente</button>
            <button id="ppt-share" class="btn btn-secondary">Compartilhar resultado</button>
          </div>
        </article>
      </section>
